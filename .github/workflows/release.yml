# 출시 — 공개 거울 developedby-dev/sdk-dotnet (ADR-0050). 원천은 모노레포 sdks/dotnet/.github/workflows/release.yml — 거울에서 고치지 않는다.
# 판 태그(v1.0.0)를 밀면 짓고 시험한 꾸러미(.nupkg · .snupkg)를, 환경 release에서 대표가 승인한 뒤 NuGet 신뢰 게시(OIDC — 1시간 단회 키)로 올린다.
# 올린 꾸러미에는 GitHub 증명을 남긴다. NuGet 신뢰 게시 정책은 이 저장소 · 이 파일 이름(release.yml)에 묶인다. 손으로 돌리면(workflow_dispatch) 짓기 · 시험만 한다
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
      - run: dotnet format Bydev.slnx --verify-no-changes
      - run: dotnet build Bydev.slnx -warnaserror
      - run: dotnet test tests --no-build
      # 모노레포는 실수로 꾸리지 않게 IsPackable=false다 — 출시 짓기는 여기서 켠다(출시 리허설과 같다)
      - run: dotnet pack src/Bydev.Sdk/Bydev.Sdk.csproj -c Release -o out -p:IsPackable=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: out/
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: out/
      - name: 태그와 꾸러미 판이 같은지
        env:
          TAG: ${{ github.ref_name }}
        run: ls "out/Bydev.Sdk.${TAG#v}.nupkg" "out/Bydev.Sdk.${TAG#v}.snupkg"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.nupkg
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: developedby-dev
      - name: 게시 (신뢰 게시 — 기호 꾸러미도 함께)
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          TAG: ${{ github.ref_name }}
        run: dotnet nuget push "out/Bydev.Sdk.${TAG#v}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
